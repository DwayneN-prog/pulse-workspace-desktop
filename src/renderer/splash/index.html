<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Pulse Workspace</title>
<link rel="stylesheet" href="splash.css" />
</head>
<body>
  <div class="splash">
    <!-- The actual Pulse logo asset (assets/logo/pulse-logo.png - the
         team's own upload, pixels untouched), used exactly as provided.
         Static here on purpose - the block loader below carries all the
         motion now; nothing animates the logo itself. -->
    <img class="pulse-loader__logo" src="../../../assets/logo/pulse-logo.png" alt="Pulse" />
    <div class="product-name">Pulse Workspace</div>

    <div class="pulse-loader__track" role="status" aria-live="polite" aria-label="Loading">
      <div class="pulse-loader__block"></div>
      <div class="pulse-loader__block"></div>
      <div class="pulse-loader__block"></div>
      <div class="pulse-loader__block"></div>
      <div class="pulse-loader__block"></div>
    </div>

    <div class="pulse-loader__message" id="pulse-loader-message">Initializing...</div>
  </div>

  <script src="splash.js"></script>
</body>
</html>
